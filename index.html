<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <strong id="city-name">—</strong>
    <span id="date" class="mono"></span>
    <span title="População">👥 <span id="population">0</span></span>
    <span title="Empregados / desempregados">💼 <span id="employment">0</span></span>
    <span title="Dinheiro">💰 <span id="money">0</span></span>
    <span class="rci" title="Demanda: residencial, comercial, industrial">
      <span class="bar" id="demand-r"><i></i></span>
      <span class="bar" id="demand-c"><i></i></span>
      <span class="bar" id="demand-i"><i></i></span>
    </span>
    <span class="spacer"></span>
    <span class="speeds" id="speeds">
      <button data-speed="0" title="Pausar (espaço)">⏸</button>
      <button data-speed="1" title="Velocidade 1 (tecla 1)">▶</button>
      <button data-speed="2" title="Velocidade 2 (tecla 2)">▶▶</button>
      <button data-speed="3" title="Velocidade 3 (tecla 3)">▶▶▶</button>
    </span>
  </header>

  <nav class="toolbar" id="tools"></nav>

  <main id="viewport">
    <canvas id="map"></canvas>
    <div id="tooltip" hidden></div>
    <aside id="inspector" hidden>
      <button id="inspector-close" class="close" title="Fechar">×</button>
      <div id="inspector-body"></div>
    </aside>
    <canvas id="minimap" width="220" height="120"></canvas>
  </main>

  <footer class="savebar">
    <button id="btn-new">Nova cidade</button>
    <button id="btn-save" title="Ctrl+S">Salvar</button>
    <button id="btn-save-as">Salvar como…</button>
    <button id="btn-load">Carregar…</button>
    <button id="btn-export">Exportar arquivo</button>
    <button id="btn-import">Importar arquivo</button>
    <button id="btn-code">Código de save</button>
    <input type="file" id="file-input" accept=".json,application/json" hidden>
    <span class="spacer"></span>
    <span id="storage-mode" class="muted"></span>
    <span id="status" class="muted"></span>
  </footer>

  <dialog id="load-dialog">
    <h2>Carregar cidade</h2>
    <ul id="save-list"></ul>
    <form method="dialog"><button>Fechar</button></form>
  </dialog>

  <dialog id="code-dialog">
    <h2>Código de save</h2>
    <p class="muted">Copie para fazer backup ou cole um código para carregar.</p>
    <textarea id="code-text" rows="8"></textarea>
    <div class="row">
      <button id="btn-code-copy">Copiar</button>
      <button id="btn-code-load">Carregar código colado</button>
      <form method="dialog"><button>Fechar</button></form>
    </div>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
